{% extends 'base.html' %}

{% block title %}Register - E-Leary{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-slate-50 via-white to-slate-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950">
    <!-- Decorative Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-10 w-72 h-72 bg-teal-300/10 dark:bg-teal-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-40 right-20 w-96 h-96 bg-emerald-300/10 dark:bg-emerald-500/5 rounded-full blur-3xl"></div>
    </div>
    
    <!-- Decorative Blobs -->
    <div class="absolute top-20 right-20 w-72 h-72 bg-teal-300 dark:bg-teal-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 dark:opacity-10 animate-float"></div>
    <div class="absolute bottom-20 left-20 w-72 h-72 bg-emerald-300 dark:bg-emerald-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 dark:opacity-10 animate-float" style="animation-delay: 2s"></div>
    
    <div class="bg-white dark:bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl shadow-slate-200/50 dark:shadow-slate-900/50 p-8 md:p-12 max-w-md w-full relative z-10 border border-slate-200/50 dark:border-slate-700/50 animate-fade-in">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 bg-gradient-to-br from-teal-400 via-emerald-400 to-teal-500 rounded-3xl flex items-center justify-center shadow-xl shadow-teal-400/30 dark:shadow-teal-500/20 flex-shrink-0 transform hover:scale-110 transition-transform duration-300">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </div>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white mb-2 tracking-tight">Create Account</h1>
            <p class="text-slate-600 dark:text-slate-400 font-medium">Join E-Leary and start learning today</p>
        </div>

        <!-- Register Form -->
        <form method="POST" class="space-y-5">
            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Username</label>
                <div class="relative">
                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="currentColor" viewBox="0 0 20 20"><path d="M10.893 1.378a1 1 0 00-.786 0l-7 3A1 1 0 003 4.72v.76a29.06 29.06 0 015.555 1.946 29.052 29.052 0 015.887 0 1 1 0 100-1.986A27.04 27.04 0 005 5.45V4.72a1 1 0 00.893-1.342zm-7ab a28.052 28.052 0 01-1.112-.20a1 1 0 10-.106 1.991 30.989 30.989 0 011.591.213 1 1 0 00.784-1.860zm13.23-1.888a1 1 0 00-.784 1.86 1.007 1.007 0 01.146.05c.524.115 1.07.25 1.591.213a1 1 0 00-.106-1.991 28.052 28.052 0 00-1.112.02zM5 9.09V7.387a28.04 28.04 0 010-.605A1 1 0 106.72 8.22v1.6a1 1 0 10-1.72 0v-.73m0 0a27.35 27.35 0 005.06 0m5.338-3.172a1 1 0 100-1.986 28.06 28.06 0 00-7.338 0 1 1 0 100 1.986 27.986 27.986 0 017.338 0zm3.039 2.196a1 1 0 100-1.939 28.282 28.282 0 00-.765-.135 1 1 0 10.188 1.974c.254.036.512.078.765.135zm1.068 1.715a1 1 0 10-1.879-.557A28.364 28.364 0 0015 12.75 1 1 0 0016.82 13.5a30.366 30.366 0 01-1.013-.715zM8.5 17.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm6-8a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"/></svg>
                    <input type="text" id="username" name="username" required 
                           class="w-full pl-12 pr-4 py-3.5 border border-slate-200 dark:border-slate-600 rounded-2xl focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all bg-white/80 dark:bg-slate-700/50 dark:text-white"
                           placeholder="Choose a username">
                </div>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Email Address</label>
                <div class="relative">
                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <input type="email" id="email" name="email" required 
                           class="w-full pl-12 pr-4 py-3.5 border border-slate-200 dark:border-slate-600 rounded-2xl focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all bg-white/80 dark:bg-slate-700/50 dark:text-white"
                           placeholder="your@hospital.com">
                </div>
            </div>

            <!-- Division -->
            <div>
                <label for="division" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Division/Department</label>
                <div class="relative">
                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                    <select id="division" name="division" class="w-full pl-12 pr-4 py-3.5 border border-slate-200 dark:border-slate-600 rounded-2xl focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all appearance-none bg-white/80 dark:bg-slate-700/50 dark:text-white">
                        <option value="Medical">🏥 Medical</option>
                        <option value="Nursing">👨‍⚕️ Nursing</option>
                        <option value="Mahasiswa/Koas">🎓 Mahasiswa/Koas</option>
                        <option value="Administration">📋 Administration</option>
                        <option value="IT">💻 IT</option>
                        <option value="Other">📁 Other</option>
                    </select>
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Password</label>
                <div class="relative">
                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <input type="password" id="password" name="password" required 
                           class="w-full pl-12 pr-4 py-3.5 border border-slate-200 dark:border-slate-600 rounded-2xl focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all bg-white/80 dark:bg-slate-700/50 dark:text-white"
                           placeholder="Create a strong password">
                </div>
            </div>

            <!-- Pemateri (Instructor) Request Checkbox -->
            <div class="flex items-start gap-3 bg-gradient-to-r from-teal-50 to-emerald-50 dark:from-teal-900/20 dark:to-emerald-900/20 p-4 rounded-2xl border border-teal-200 dark:border-teal-800/50">
                <input type="checkbox" id="request_pemateri" name="request_pemateri" 
                       class="mt-1 w-4 h-4 text-teal-600 bg-white dark:bg-slate-700 border-teal-300 dark:border-teal-700 rounded focus:ring-teal-500 focus:ring-2 cursor-pointer">
                <label for="request_pemateri" class="text-sm cursor-pointer">
                    <span class="font-semibold text-slate-800 dark:text-slate-200">Register as Instructor (Pemateri)</span>
                    <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">Check this if you want to create and manage training courses</p>
                </label>
            </div>

            <!-- Register Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 dark:from-teal-600 dark:to-emerald-600 dark:hover:from-teal-700 dark:hover:to-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-teal-500/30 hover:shadow-teal-500/50 dark:shadow-teal-500/20 transition-all duration-300 flex items-center justify-center gap-2 text-lg group transform hover:scale-105 active:scale-95">
                <svg class="w-5 h-5 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
                <span>Create Account</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="my-8 relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-white dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 rounded-full">Already have an account?</span>
            </div>
        </div>

        <!-- Login Link -->
        <a href="{{ url_for('login') }}" class="w-full block text-center bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-700 dark:to-slate-600 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-600 dark:hover:to-slate-500 text-slate-800 dark:text-white font-semibold py-3.5 rounded-2xl transition-all duration-300 border border-slate-200 dark:border-slate-600 shadow-sm">
            Sign In
        </a>

        <!-- Terms -->
        <p class="text-xs text-slate-500 dark:text-slate-400 text-center mt-6">
            By registering, you agree to our <a href="#" class="text-teal-600 dark:text-teal-400 hover:underline font-medium">Terms of Service</a> and <a href="#" class="text-teal-600 dark:text-teal-400 hover:underline font-medium">Privacy Policy</a>
        </p>
    </div>
</div>
{% endblock %}
